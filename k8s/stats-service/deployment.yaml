apiVersion: apps/v1             # API version
kind: Deployment                # type of object
metadata:
  name: stats-service           # name of this Deployment object
spec:
  replicas: 1                   # how many Pod copies to keep running
  selector:
    matchLabels:
      app: stats-service        # Deployment manages any Pod with this label
  template:                     # this is the "Pod blueprint
    metadata:
      labels:
        app: stats-service      # the label being matched above
    spec:
      containers:
        - name: stats-service
          image: shaadn/21orange-stats-service:latest
          imagePullPolicy: Always
          command: ["sh", "-c", "python manage.py migrate && python manage.py runserver 0.0.0.0:8002"]
          ports:
            - containerPort: 8002
          env:
            - name: DEBUG
              value: "True"
            - name: ALLOWED_HOSTS
              value: "*"
            - name: CORS_ALLOWED_ORIGINS
              value: "http://21orange.local"
            - name: STATS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: stats-secrets
                  key: SECRET_KEY
          