apiVersion: apps/v1             # API version
kind: Deployment                # type of object
metadata:
  name: qr-service       # name of this Deployment object
spec:
  replicas: 1                   # how many Pod copies to keep running
  selector:
    matchLabels:
      app: qr-service    # Deployment manages any Pod with this label
  template:                     # this is the "Pod blueprint
    metadata:
      labels:
        app: qr-service  # the label being matched above
    spec:
      containers:
        - name: qr-service
          image: shaadn/21orange-qr-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8003
          env:
            - name: SHORTENER_SERVICE_URL
              value: "http://shortener-service:8001"
            - name: DEBUG
              value: "True"
            - name: ALLOWED_HOSTS
              value: "*"
            - name: CORS_ALLOWED_ORIGINS
              value: "http://21orange.local"
            - name: QR_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: qr-secrets
                  key: SECRET_KEY