name: CI

on:
  push:
    branches: [main, staging, develop, 'feature/**']
  pull_request:
    branches: [main, staging, develop]

jobs:
  test-django-service:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [shortener-service, stats-service, qr-service]

    defaults:
      run:
        working-directory: ${{ matrix.service }}

    env:
      DEBUG: "True"
      ALLOWED_HOSTS: "*"
      CORS_ALLOWED_ORIGINS: "http://localhost:3000"
      SHORTENER_SECRET_KEY: "ci-test-key-shortener"
      STATS_SECRET_KEY: "ci-test-key-stats"
      QR_SECRET_KEY: "ci-test-key-qr"
      STATS_SERVICE_URL: "http://localhost:8002"
      SHORTENER_SERVICE_URL: "http://localhost:8001"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: ${{ matrix.service }}/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run migrations (build check)
        run: python manage.py migrate --noinput
        if: matrix.service != 'qr-service'

      - name: Run tests
        run: python manage.py test


  test-frontend:
    name: Test frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm run test
        env:
          VITE_PORT: 3000
          VITE_SHORTENER_URL: http://localhost:8001
          VITE_STATS_URL: http://localhost:8002
          VITE_QR_URL: http://localhost:8003

      - name: Build
        run: npm run build
        env:
          VITE_PORT: 3000
          VITE_SHORTENER_URL: http://localhost:8001
          VITE_STATS_URL: http://localhost:8002
          VITE_QR_URL: http://localhost:8003


  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: [test-django-service, test-frontend]

    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate Python coverage
        run: |
          for svc in shortener-service stats-service qr-service; do
            cd $svc
            pip install -r requirements.txt
            coverage run manage.py test
            coverage xml
            cd ..
          done

        env:
          DEBUG: "True"
          ALLOWED_HOSTS: "*"
          CORS_ALLOWED_ORIGINS: "http://localhost:3000"
          SHORTENER_SECRET_KEY: "ci-test-key-shortener"
          STATS_SECRET_KEY: "ci-test-key-stats"
          QR_SECRET_KEY: "ci-test-key-qr"
          STATS_SERVICE_URL: "http://localhost:8002"
          SHORTENER_SERVICE_URL: "http://localhost:8001"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate frontend coverage
        working-directory: frontend
        run: |
          npm ci
          npm run test:coverage

        env:
          VITE_PORT: 3000
          VITE_SHORTENER_URL: http://localhost:8001
          VITE_STATS_URL: http://localhost:8002
          VITE_QR_URL: http://localhost:8003

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

      - name: Wait for and check Quality Gate
        run: |
          set -e

          TASK_ID=$(grep ceTaskId .scannerwork/report-task.txt | cut -d'=' -f2)

          echo "Polling task: $TASK_ID"

          for i in $(seq 1 30); do
            STATUS=$(curl -s -u "${SONAR_TOKEN}:" \
              "https://sonarcloud.io/api/ce/task?id=${TASK_ID}" | \
              python3 -c "import sys,json; print(json.load(sys.stdin)['task']['status'])")

            echo "Task status: $STATUS"

            if [ "$STATUS" = "SUCCESS" ]; then
              break
            elif [ "$STATUS" = "FAILED" ] || [ "$STATUS" = "CANCELED" ]; then
              echo "Analysis task failed"
              exit 1
            fi

            sleep 5
          done

          GATE_STATUS=$(curl -s -u "${SONAR_TOKEN}:" \
            "https://sonarcloud.io/api/qualitygates/project_status?projectKey=shaad4_21orange-url-shortener" | \
            python3 -c "import sys,json; print(json.load(sys.stdin)['projectStatus']['status'])")

          echo "Quality Gate status: $GATE_STATUS"

          if [ "$GATE_STATUS" != "OK" ] && [ "$GATE_STATUS" != "NONE" ]; then
            echo "Quality Gate failed"
            exit 1
          fi

        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}


  docker-build-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest

    needs: [test-django-service, test-frontend, sonarcloud]

    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'

    strategy:
      matrix:
        service: [shortener-service, stats-service, qr-service, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: true

          tags: |
            ${{ secrets.DOCKER_USERNAME }}/21orange-${{ matrix.service }}:latest
            ${{ secrets.DOCKER_USERNAME }}/21orange-${{ matrix.service }}:${{ github.sha }}

          cache-from: type=gha
          cache-to: type=gha,mode=max


  deploy-to-minikube:
    name: Deploy to Minikube
    runs-on: self-hosted

    needs: docker-build-push

    if: github.ref == 'refs/heads/develop'

    steps:
      - name: Update Kubernetes images
        run: |
          kubectl set image deployment/shortener-service \
            shortener-service=shaadn/21orange-shortener-service:${{ github.sha }}

          kubectl set image deployment/stats-service \
            stats-service=shaadn/21orange-stats-service:${{ github.sha }}

          kubectl set image deployment/qr-service \
            qr-service=shaadn/21orange-qr-service:${{ github.sha }}

          kubectl set image deployment/frontend \
            frontend=shaadn/21orange-frontend:${{ github.sha }}

      - name: Wait for deployments
        run: |
          kubectl rollout status deployment/shortener-service --timeout=120s
          kubectl rollout status deployment/stats-service --timeout=120s
          kubectl rollout status deployment/qr-service --timeout=120s
          kubectl rollout status deployment/frontend --timeout=120s

      - name: Verify deployment
        run: |
          kubectl get deployments
          kubectl get pods